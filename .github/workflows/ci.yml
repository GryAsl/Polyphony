name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck (errors gate)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error scripts/*.sh tests/*.sh hooks/*.sh
          else
            for script in scripts/*.sh tests/*.sh hooks/*.sh; do bash -n "$script"; done
          fi

      - name: Python compile
        run: python3 -m py_compile scripts/measure-session.py scripts/agy-windows-bridge.py tests/test-windows-bridge.py

      - name: Validate JSON manifests
        run: |
          python3 - <<'PY'
          import json
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "prices.json",
                    "hooks/policy-context.json"):
              json.load(open(p))
              print("ok", p)
          PY

      - name: Critical smoke tests (offline; no API keys)
        run: bash tests/run-tests.sh
